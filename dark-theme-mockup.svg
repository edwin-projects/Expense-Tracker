<svg xmlns="http://www.w3.org/2000/svg" width="820" height="780"
     viewBox="0 0 820 780"
     font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif">

  <!-- Outer canvas: warm linen -->
  <rect width="820" height="780" fill="#f2ede6" rx="20"/>
  <text x="410" y="36" text-anchor="middle" font-size="11" fill="#8a7a68"
        font-weight="500" letter-spacing="0.13em">DARK THEME MOCKUP · TWO OPTIONS</text>
  <text x="410" y="53" text-anchor="middle" font-size="10" fill="#aa9a88"
        letter-spacing="0.04em">☾ icon on every tab — tap to toggle</text>

  <!-- ============================================================ -->
  <!-- PHONE A: DARK WALNUT                                         -->
  <!-- Deep cocoa bg · warm cream text · thin gold ring on NW card  -->
  <!-- ============================================================ -->
  <g transform="translate(24, 64)">

    <!-- Chassis -->
    <rect width="364" height="648" rx="40" fill="#0b0907"/>
    <!-- Side buttons (decorative) -->
    <rect x="-3" y="138" width="3" height="30" rx="1.5" fill="#181310"/>
    <rect x="-3" y="178" width="3" height="50" rx="1.5" fill="#181310"/>
    <rect x="367" y="158" width="3" height="58" rx="1.5" fill="#181310"/>

    <!-- Screen -->
    <rect x="6" y="6" width="352" height="636" rx="34" fill="#1c1812"/>

    <!-- Status bar -->
    <text x="22" y="33" font-size="10" fill="#8f7d69">9:41</text>
    <!-- Battery -->
    <rect x="304" y="24" width="30" height="11" rx="2.5" fill="none" stroke="#8f7d69" stroke-width="1"/>
    <rect x="306" y="26" width="20" height="7" rx="1" fill="#8f7d69"/>
    <rect x="334" y="27" width="2.5" height="5" rx="0.8" fill="#8f7d69"/>
    <!-- Signal -->
    <circle cx="288" cy="29" r="2" fill="#8f7d69"/>
    <circle cx="280" cy="29" r="2" fill="#8f7d69"/>
    <circle cx="272" cy="29" r="2" fill="#8f7d69" opacity="0.5"/>

    <!-- Moon toggle -->
    <circle cx="332" cy="58" r="17" fill="#26201a"/>
    <text x="332" y="64" text-anchor="middle" font-size="17" fill="#d4aa58">☾</text>

    <!-- Page heading -->
    <text x="22" y="64" font-size="11" fill="#8f7d69" font-weight="500" letter-spacing="0.11em">SUMMARY</text>

    <!-- NET WORTH CARD — thin gold outline -->
    <rect x="14" y="78" width="332" height="90" rx="14" fill="#26201a"/>
    <rect x="14" y="78" width="332" height="90" rx="14" fill="none" stroke="#d4aa58" stroke-width="0.85" opacity="0.32"/>
    <text x="28" y="100" font-size="9" fill="#8f7d69" letter-spacing="0.11em">NET WORTH</text>
    <text x="28" y="135" font-size="29" fill="#ede0ca" font-weight="700" font-variant-numeric="tabular-nums">₹28,45,312</text>
    <text x="28" y="157" font-size="11" fill="#5fa876">▲ ₹12,340 this month</text>

    <!-- CASH FLOW CARDS -->
    <!-- Income -->
    <rect x="14" y="180" width="156" height="66" rx="12" fill="#26201a"/>
    <text x="26" y="200" font-size="8.5" fill="#8f7d69" letter-spacing="0.09em">INCOME</text>
    <text x="26" y="230" font-size="21" fill="#5fa876" font-weight="700" font-variant-numeric="tabular-nums">₹1,20,000</text>

    <!-- Expenses -->
    <rect x="188" y="180" width="158" height="66" rx="12" fill="#26201a"/>
    <text x="200" y="200" font-size="8.5" fill="#8f7d69" letter-spacing="0.09em">EXPENSES</text>
    <text x="200" y="230" font-size="21" fill="#c06060" font-weight="700" font-variant-numeric="tabular-nums">₹45,230</text>

    <!-- Net flow -->
    <rect x="14" y="256" width="332" height="44" rx="12" fill="#26201a"/>
    <text x="28" y="276" font-size="9" fill="#8f7d69" letter-spacing="0.09em">NET CASH FLOW</text>
    <text x="334" y="278" text-anchor="end" font-size="21" fill="#5d8ec4" font-weight="700" font-variant-numeric="tabular-nums">+₹74,770</text>

    <!-- ASSETS label -->
    <text x="22" y="322" font-size="9" fill="#8f7d69" letter-spacing="0.12em">ASSETS</text>

    <!-- Row: Investments -->
