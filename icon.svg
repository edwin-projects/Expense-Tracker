<!-- D & E Finance — "Rise".
     Three bars: two ivory receding, one brass leading, over a faint
     baseline. The same three colours as the app (Vault: graphite ground,
     ivory ink, brass accent) and the same shape as the Summary tab icon,
     so the app and its mark agree. No gradient, bevel or drop shadow —
     iOS rounds and lights the tile itself. The mark is centred on the
     canvas and fills half its width, so it still reads at 58px. -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="D and E Finance">
  <rect width="512" height="512" rx="115" fill="#17171a"/>
  <g stroke-linecap="round" stroke-width="44" fill="none">
    <path d="M150 356v-60"  stroke="#f0eee9" opacity="0.42"/>
    <path d="M256 356v-140" stroke="#f0eee9" opacity="0.68"/>
    <path d="M362 356v-224" stroke="#d3b168"/>
  </g>
  <path d="M128 400h256" stroke="#f0eee9" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
</svg>
